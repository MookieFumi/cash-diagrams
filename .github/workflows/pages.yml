name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build SVG and comparison page
        run: |
          node eval/svg/gen.mjs
          node eval/compare.mjs
      - name: Build JSX reference
        working-directory: eval/jsx
        run: npm ci && npm run build
      - name: Assemble site
        run: |
          mkdir -p _site/jsx _site/svg
          cp eval/index.html _site/index.html
          cp -r eval/jsx/dist _site/jsx/dist
          cp eval/svg/request-flow.svg eval/svg/request-flow.snippet.html _site/svg/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
